document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ity:.2;animation:rf-orbit2 20s linear infinite\"><\u002Fspan><\u002Fdiv>\n<img src=\"73c8be7d-d21c-4881-8c4a-d88cc69ac7e8\" alt=\"\" style=\"position:relative;width:132px;height:116px;object-fit:contain;display:block;margin-bottom:4px;animation:rf-up .8s cubic-bezier(.2,.7,.2,1) both,rf-float 6s ease-in-out 1s infinite;filter:drop-shadow(0 16px 24px rgba(14,165,233,0.25))\">\n<span style=\"position:relative;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;background:#f0f9ff;border:1px solid #bae6fd;color:#0b3d91;font-size:13px;font-weight:600;animation:rf-up .7s cubic-bezier(.2,.7,.2,1) .1s both\"><span style=\"width:6px;height:6px;border-radius:50%;background:#0ea5e9\"><\u002Fspan>Prima valutazione legale gratuita<\u002Fspan>\n<h1 style=\"position:relative;animation:rf-up .8s cubic-bezier(.2,.7,.2,1) .1s both;margin:0;max-width:820px;font-size:clamp(32px,9vw,40px);font-weight:800;line-height:1.08;letter-spacing:-0.03em;text-wrap:balance\">Truffato online? <span style=\"color:#0ea5e9;background:linear-gradient(90deg,#0ea5e9 0%,#38bdf8 45%,#7dd3fc 50%,#38bdf8 55%,#0ea5e9 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rf-shine 4s linear 1.2s infinite\">Recupera i tuoi soldi<\u002Fspan> con un team legale al tuo fianco.<\u002Fh1>\n<p style=\"position:relative;animation:rf-up .8s cubic-bezier(.2,.7,.2,1) .2s both;margin:0;max-width:600px;font-size:16px;line-height:1.6;color:#475569;text-wrap:pretty\">Analizziamo il caso, tracciamo i fondi e attiviamo chargeback, richiami bancari e azioni legali. Ti diciamo in 72 ore se e come è possibile recuperare.<\u002Fp>\n<div style=\"position:relative;animation:rf-up .8s cubic-bezier(.2,.7,.2,1) .3s both;display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px\">\n<a href=\"#richiesta\" style=\"display:inline-flex;align-items:center;justify-content:center;height:52px;padding:0 26px;background:#0 ,1),border-color .3s,box-shadow .3s;transition-delay:{{ t.delay }}\" style-hover=\"border-color:#bae6fd;box-shadow:0 16px 40px -18px rgba(15,23,42,0.2);transform:translateY(-4px)\">\n<span style=\"width:40px;height:40px;border-radius:10px;background:#0f172a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700\">{{ t.icon }}<\u002Fspan>\n<h3 style=\"margin:0;font-size:18px;font-weight:700;letter-spacing:-0.01em\">{{ t.title }}<\u002Fh3>\n<p style=\"margin:0;font-size:14px;line-height:1.6;color:#475569;text-wrap:pretty\">{{ t.text }}<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:4px\">\n<sc-for list=\"{{ t.tags }}\" as=\"tag\" hint-placeholder-count=\"4\"><span style=\"font-size:12px;font-weight:500;color:#334155;background:#f1f5f9;border-radius:6px;padding:4px 8px\">{{ tag }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div data-reveal=\"\" style=\"width:100%;display:flex;flex-direction:column;gap:18px;align-items:center;padding:36px 0 0;border-top:1px solid #eef2f7\">\n<span style=\"font-size:13px;color:#64748b\">Interveniamo presso gli uffici antifrode dei principali istituti italiani<\u002Fspan>\n<div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;max-width:960px\">\n<sc-for list=\"{{ bankStrip }}\" as=\"b\" hint-placeholder-count=\"10\"><span style=\"font-size:13px;font-weight:700;color:#94a3b8;letter-spacing:-0.01em;transition:color .3s\" style-hover=\"color:#0f172a\">{{ b }}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"recensioni\" data-screen-label=\"Recensioni\" style=\"width:100%;max-width:480px;padding:64px 20px;display:flex;flex-direction:column;align-items:center;gap:36px\">\n<div data-reveal=\"\" style=\"text-align:center;max-width:620px;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font-size:13px;font-weight:600;color:#0ea5e9;letter-spacing:0.02em\">Recensioni<\ ;font-weight:600;color:#0ea5e9;letter-spacing:0.02em\">Come funziona<\u002Fspan>\n<h2 style=\"margin:0;font-size:clamp(26px,7vw,32px);font-weight:800;line-height:1.1;letter-spacing:-0.03em;text-wrap:balance\">Dalla segnalazione al recupero in quattro fasi<\u002Fh2>\n<\u002Fdiv>\n<div style=\"width:100%;display:grid;grid-template-columns:1fr;gap:14px\">\n<sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n<div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:16px;background:#fff;border:1px solid #e2e8f0;transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s;transition-delay:{{ st.delay }}\" style-hover=\"border-color:#bae6fd;box-shadow:0 16px 40px -18px rgba(15,23,42,0.2);transform:translateY(-4px)\">\n<span style=\"width:32px;height:32px;border-radius:50%;background:#0f172a;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700\">{{ st.n }}<\u002Fspan>\n<h3 style=\"margin:0;font-size:18px;font-weight:700;letter-spacing:-0.01em\">{{ st.title }}<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#475569;text-wrap:pretty\">{{ st.text }}<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"richiesta\" data-screen-label=\"Modulo\" style=\"width:100%;display:flex;justify-content:center;background:linear-gradient(180deg,#ffffff 0%,#e0f2fe 45%,#ffffff 100%);color:#0f172a\">\n<div style=\"width:100%;max-width:480px;padding:64px 20px;display:grid;grid-template-columns:1fr;gap:36px;align-items:center\">\n<div data-reveal=\"\" style=\"display:flex;flex-direction:column;gap:20px\">\n<span style=\"font-size:13px;font-weight:600;color:#0284c7;letter-spacing:0.02em\">Valutazione gratuita<\u002Fspan>\n<h2 style=\"margin:0;font-size:clamp(26px,7vw,32px);font-weight:800;line-height:1.1;letter-spacing:-0.03em;text-wrap:balance;color:#0f172a\">Raccontaci cosa è su 360px\">Grazie, {{ form.name }}. Un legale ti contatterà entro 72 ore all'indirizzo indicato.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n<form data-reveal=\"\" sc-camel-on-submit=\"{{ submit }}\" style=\"background:#fff;color:#0f172a;border-radius:16px;transition-delay:.15s;padding:22px;display:flex;flex-direction:column;gap:18px;border:1px solid #e2e8f0;box-shadow:0 30px 60px -30px rgba(14,165,233,0.35)\">\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Nome e cognome\n<input name=\"name\" required=\"\" value=\"{{ form.name }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"Maria Rossi\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\">\n<\u002Flabel>\n<div style=\"display:grid;grid-template-columns:1fr;gap:16px\">\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">E-mail\n<input name=\"email\" type=\"email\" required=\"\" value=\"{{ form.email }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"nome@esempio.it\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\">\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Telefono\n<input name=\"phone\" type=\"tel\" value=\"{{ form.phone }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"+39 …\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\">\n<\u002Flabel>\n<\u002Fdiv>\n<div style=\"displa e=\"text\" value=\"{{ form.date }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"es. marzo 2026\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\">\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Piattaforma / nome usato dai truffatori\n<input name=\"platform\" type=\"text\" value=\"{{ form.platform }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"es. sito, app, società, profilo social\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\">\n<\u002Flabel>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;margin-top:6px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#0ea5e9;white-space:nowrap\">Il pagamento<\u002Fspan><span style=\"height:1px;flex:1;background:#eef2f7\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr;gap:16px\">\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Metodo di pagamento\n<sc-raw-select name=\"method\" value=\"{{ form.method }}\" sc-camel-on-change=\"{{ onField }}\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\"><option value=\"\">Seleziona<\u002Foption><option value=\"bonifico\">Bonifico SEPA<\u002Foption><option value=\"istantaneo\">Bonifico istantaneo<\u002Foption><option value=\"carta\">Carta di credito / debito<\u002Foption><option value=\"postepay\">Ricarica Postepay<\u002Foption><option value=\"paypal\">PayPal / wallet digitale<\u002Foption><option value=\"crypto\">Criptovalute<\u002Foption><option value=\"contanti\">Contanti / altro<\u002Foption><\u002Fsc-raw-select>\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">La tua banca\n<sc-raw-select name=\"bank\" value=\"{{ form.bank }}\" sc-camel-on-change=\"{{ onField }}\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\"><option value=\"\">Seleziona la banca<\u002Foption><option value=\"Intesa Sanpaolo\">Intesa Sanpaolo<\u002Foption><option value=\"UniCredit\">UniCredit<\u002Foption><option value=\"Banco BPM\">Banco BPM<\u002Foption><option value=\"BPER Banca\">BPER Banca<\u002Foption><option value=\"Banca Monte dei Paschi di Siena\">Banca Monte dei Paschi di Siena<\u002Foption><option value=\"Crédit Agricole Italia\">Crédit Agricole Italia<\u002Foption><option value=\"BNL – BNP Paribas\">BNL – BNP Paribas<\u002Foption><option value=\"Credem\">Credem<\u002Foption><option value=\"Banca Popolare di Sondrio\">Banca Popolare di Sondrio<\u002Foption><option value=\"Banca Sella\">Banca Sella<\u002Foption><option value=\"Fineco\">Fineco<\u002Foption><option value=\"Poste Italiane – BancoPosta / Postepay\">Poste Italiane – BancoPosta / Postepay<\u002Foption><option value=\"Banca Mediolanum\">Banca Mediolanum<\u002Foption><option value=\"Mediobanca Premier (CheBanca!)\">Mediobanca Premier (CheBanca!)<\u002Foption><option value=\"ING Italia\">ING Italia<\u002Foption><option value=\"Widiba\">Widiba<\u002Foption><option value=\"Illimity\">Illimity<\u002Foption><option value=\"Banca Generali\">Banca Generali<\u002Foption><option value=\"Banca Ifis\">Banca Ifis<\u002Foption><option value=\"Deutsche Bank Italia\">Deutsche Bank Italia<\u002Foption><option value=\"Cassa Centrale Banca – BCC\">Cassa Centrale Banca – BCC<\u002Foption><option value=\"Iccrea – BCC\">Iccrea – BCC<\u002Foption><option value=\"Banca Popolare di Bari\">Banca Popolare di Bari<\u002Foption><option value=\"Banca Popolare Pugliese\">Banca Popolare Pugliese<\u002Foption><option value=\"Cassa di Risparmio di Bolzano – Sparkasse\">Cassa di Risparmio di Bolzano – Sparkasse<\u002Foption><option value=\"Volksbank – Banca Popolare dell'Alto Adige\">Volksbank – Banca Popolare dell'Alto Adige<\u002Foption><option value=\"Hype\">Hype<\u002Foption><option value=\"Revolut\">Revolut<\u002Foption><option value=\"N26\">N26<\u002Foption><option value=\"Buddybank\">Buddybank<\u002Foption><option value=\"Tinaba\">Tinaba<\u002Foption><option value=\"Altro istituto\">Altro istituto<\u002Foption><\u002Fsc-raw-select>\n<\u002Flabel>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr;gap:16px\">\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">IBAN / wallet del destinatario (se noto)\n<input name=\"recipient\" type=\"text\" value=\"{{ form.recipient }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"IT60 X054 … oppure indirizzo wallet\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\">\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Numero di transazioni\n<input name=\"txCount\" type=\"number\" min=\"1\" value=\"{{ form.txCount }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"1\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\">\n<\u002Flabel>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;margin-top:6px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#0ea5e9;white-space:nowrap\">Azioni già intraprese<\u002Fspan><span style=\"height:1px;flex:1;background:#eef2f7\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr;gap:16px\">\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Hai contattato la banca?\n<sc-raw-select name=\"bankContacted\" value=\"{{ form.bankContacted }}\" sc-camel-on-change=\"{{ onField }}\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\"><option value=\"\">Seleziona<\u002Foption><option value=\"si\">Sì, ho aperto una contestazione<\u002Foption><option value=\"parziale\">Sì, ma senza esito<\u002Foption><option value=\"no\">No, non ancora<\u002Foption><\u002Fsc-raw-select>\n<\u002Flabel>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Hai presentato denuncia?\n<sc-raw-select name=\"police\" value=\"{{ form.police }}\" sc-camel-on-change=\"{{ onField }}\" style=\"height:46px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:0 14px;font-weight:400\"><option value=\"\">Seleziona<\u002Foption><option value=\"si\">Sì, alla Polizia Postale / Carabinieri<\u002Foption><option value=\"online\">Sì, online<\u002Foption><option value=\"no\">No, non ancora<\u002Foption><\u002Fsc-raw-select>\n<\u002Flabel>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#334155\">Documenti a disposizione\n<div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n<sc-for list=\"{{ docs }}\" as=\"d\" hint-placeholder-count=\"6\"><button type=\"button\" sc-camel-on-click=\"{{ d.toggle }}\" style=\"height:34px;padding:0 12px;border-radius:999px;border:1px solid {{ d.border }};background:{{ d.bg }};color:{{ d.color }};font-size:13px;font-weight:500;cursor:pointer;transition:all .2s\">{{ d.label }}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:10px;margin-top:6px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#0ea5e9;white-space:nowrap\">La tua storia<\u002Fspan><span style=\"height:1px;flex:1;background:#eef2f7\"><\u002Fspan><\u002Fdiv>\n<label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#334155\">Racconta cosa è successo, dall'inizio\n<textarea name=\"message\" rows=\"7\" value=\"{{ form.message }}\" sc-camel-on-change=\"{{ onField }}\" placeholder=\"Come sei entrato in contatto con i truffatori, cosa ti hanno promesso, come e quando hai trasferito i soldi, cosa è successo quando hai chiesto il rimborso, se hai ancora contatti con loro…\" style=\"border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;font-size:15px;color:#0f172a;outline:none;padding:12px 14px;resize:vertical;line-height:1.5;font-weight:400\" style-focus=\"border-color:#0ea5e9;background:#fff\"><\u002Ftextarea>\n<\u002Flabel>\n\n<label style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:#64748b;font-weight:400\">\n<input type=\"checkbox\" required=\"\" style=\"margin:3px 0 0;accent-color:#0ea5e9\">\n<span>Ho letto l'informativa sulla privacy e acconsento al trattamento dei dati per essere ricontattato.<\u002Fspan>\n<\u002Flabel>\n<button type=\"submit\" style=\"height:52px;border:0;background:#0ea5e9;color:#fff;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:background .25s,transform .25s\" style-hover=\"background:#0284c7;transform:translateY(-2px)\">Invia la richiesta<\u002Fbutton>\n<\u002Fform>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"domande\" data-screen-label=\"Domande\" style=\"width:100%;max-width:480px;padding:64px 20px;display:flex;flex-direction:column;align-items:center;gap:40px\">\n<div data-reveal=\"\" style=\"text-align:center;display:flex;flex-direction:column;gap:14px\">\n<span style=\"font-size:13px;font-weight:600;color:#0ea5e9;letter-spacing:0.02em\">FAQ<\u002Fspan>\n<h2 style=\"margin:0;font-size:clamp(26px,7vw,32px);font-weight:800;line-height:1.1;letter-spacing:-0.03em\">Domande frequenti<\u002Fh2>\n<\u002Fdiv>\n<div data-reveal=\"\" style=\"width:100%;display:flex;flex-direction:column;gap:12px\">\n<sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"border:1px solid #e2e8f0;border-radius:14px;background:#fff\">\n<button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;background:transparent;border:0;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:24px;text-align:left;cursor:pointer;color:#0f172a\">\n<span style=\"font-size:16px;font-weight:600;line-height:1.35\">{{ f.q }}<\u002Fspan>\n<span style=\"width:28px;height:28px;border-radius:50%;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:#475569;flex:none;transition:transform .3s,background .3s;transform:{{ f.rot }}\">+<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:0;padding:0 22px 22px;font-size:15px;line-height:1.65;color:#475569;text-wrap:pretty;animation:rf-up .4s cubic-bezier(.2,.7,.2,1) both\">{{ f.a }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer data-screen-label=\"Footer\" style=\"width:100%;display:flex;justify-content:center;border-top:1px solid #eef2f7\">\n<div style=\"width:100%;max-width:480px;padding:32px 20px;display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center\">\n<span style=\"display:flex;align-items:center;gap:8px\"><img src=\"73c8be7d-d21c-4881-8c4a-d88cc69ac7e8\" alt=\"Fondi Protetti\" style=\"width:30px;height:26px;object-fit:contain;display:block\"><span style=\"font-weight:800;font-size:15px;letter-spacing:-0.03em;line-height:1;color:#0b3d91\">Fondi <span style=\"color:#0ea5e9\">Protetti<\u002Fspan><\u002Fspan><\u002Fspan>\n<p style=\"margin:0;max-width:640px;font-size:12px;line-height:1.6;color:#94a3b8;text-wrap:pretty\">Le informazioni contenute in questo sito hanno carattere generale e non costituiscono consulenza legale. L'esito di ogni procedura dipende dalle circostanze del singolo caso e non può essere garantito.<\u002Fp>\n<div style=\"display:flex;gap:24px;font-size:13px;color:#64748b;flex-wrap:wrap;justify-content:center\">\n<a href=\"#\" style=\"color:#64748b\">Privacy<\u002Fa><a href=\"#\" style=\"color:#64748b\">Cookie<\u002Fa><a href=\"#\" style=\"color:#64748b\">Note legali<\u002Fa><span>© 2026<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { sent: false, open: 0, form: { name: '', email: '', phone: '', type: '', amount: '', date: '', platform: '', method: '', bank: '', recipient: '', txCount: '', bankContacted: '', police: '', message: '' }, docs: [] };\n  docList = ['Ricevute / estratti conto', 'Chat e messaggi', 'E-mail', 'Screenshot della piattaforma', 'Contratti o documenti firmati', 'Dati dei truffatori'];\n  trust = [\n    { icon: 'B', title: 'Banche italiane', text: 'Richiamo del bonifico, blocco dei fondi e reclami formali direttamente con gli uffici antifrode degli istituti.', tags: ['Richiamo SEPA', 'Recall istantaneo', 'Reclamo formale', 'ABF'] },\n    { icon: 'C', title: 'Circuiti di pagamento', text: 'Procedure di chargeback e contestazione per pagamenti con carta, wallet e ricariche.', tags: ['Visa', 'Mastercard', 'PayPal', 'Postepay'] },\n    { icon: '₿', title: 'Analisi blockchain', text: 'Tracciamento on-chain delle transazioni in criptovaluta fino agli exchange, con richieste di congelamento.', tags: ['Bitcoin', 'Ethereum', 'USDT', 'Exchange KYC'] },\n    { icon: 'A', title: 'Autorità e organismi', text: 'Denunce, segnalazioni e ricorsi presso le autorità competenti per il settore finanziario.', tags: ['Polizia Postale', 'Banca d’Italia', 'CONSOB', 'Arbitro Bancario'] },\n  ];\n  bankStrip = ['Intesa Sanpaolo', 'UniCredit', 'Banco BPM', 'BPER', 'MPS', 'Crédit Agricole', 'BNL', 'Credem', 'Fineco', 'Poste Italiane', 'Mediolanum', 'Banca Sella', 'ING', 'Revolut', 'N26'];\n  reviews = [\n    { initials: 'GM', name: 'Giulia M.', meta: 'Milano · Falsi investimenti', amount: '18.500 €', text: 'Pensavo di aver perso tutto. In due giorni avevano già chiesto il richiamo del bonifico alla mia banca e dopo sette settimane ho rivisto quasi l’intera somma sul conto.' },\n    { initials: 'AR', name: 'Andrea R.', meta: 'Roma · Criptovalute', amount: '7.200 €', text: 'Hanno tracciato i miei USDT fino a un exchange e ottenuto il blocco dei fondi. Mi hanno spiegato ogni passaggio con chiarezza, senza mai promettere l’impossibile.' },\n    { initials: 'FB', name: 'Francesca B.', meta: 'Torino · Phishing bancario', amount: '4.900 €', text: 'La banca aveva respinto il reclamo. Con il loro ricorso all’Arbitro Bancario ho ottenuto il rimborso completo. Professionali e sempre raggiungibili.' },\n  ];\n  scams = [\n    { n: '01', title: 'Falsi investimenti e trading', text: 'Piattaforme che promettono rendimenti elevati, mostrano guadagni fittizi e bloccano i prelievi al momento del ritiro.' },\n    { n: '02', title: 'Criptovalute', text: 'Wallet e exchange inesistenti, \"consulenti\" che guidano il trasferimento dei fondi verso indirizzi non tracciabili.' },\n    { n: '03', title: 'Phishing e accesso al conto', text: 'Messaggi che imitano la banca o le Poste per ottenere credenziali e disporre bonifici non autorizzati.' },\n    { n: '04', title: 'Acquisti online', text: 'Negozi e annunci fittizi: il pagamento viene incassato ma il bene non viene mai consegnato.' },\n    { n: '05', title: 'Truffa sentimentale', text: 'Relazioni costruite online per settimane o mesi, seguite da ripetute richieste di denaro per emergenze inventate.' },\n    { n: '06', title: 'Recupero crediti fasullo', text: 'Sedicenti società che promettono di recuperare i soldi persi in una precedente truffa chiedendo un anticipo.' },\n  ];\n  steps = [\n    { n: '1', title: 'Segnalazione', text: 'Compili il modulo con i dettagli dell\\'accaduto. Un legale esamina il caso e ti contatta entro 72 ore.' },\n    { n: '2', title: 'Analisi', text: 'Raccogliamo documenti, conversazioni e ricevute. Ricostruiamo il percorso dei fondi e valutiamo le possibilità di recupero.' },\n    { n: '3', title: 'Azione', text: 'Attiviamo chargeback e richiamo del bonifico, presentiamo denuncia e reclami formali a banche e intermediari.' },\n    { n: '4', title: 'Recupero', text: 'Seguiamo la pratica fino alla restituzione delle somme, in via bancaria, amministrativa o giudiziale.' },\n  ];\n  faqs = [\n    { q: 'Quanto costa la valutazione iniziale?', a: 'Nulla. Il primo esame del caso e il parere sulle possibilità di recupero sono gratuiti e senza impegno. Eventuali costi successivi vengono concordati per iscritto prima di procedere.' },\n    { q: 'Entro quanto tempo devo agire?', a: 'Il prima possibile. Il richiamo di un bonifico e il chargeback su carta hanno finestre temporali limitate; nei primi giorni le probabilità di bloccare i fondi sono sensibilmente più alte.' },\n    { q: 'Ho già fatto denuncia: serve comunque?', a: 'Sì. La denuncia è un passaggio necessario ma da sola raramente porta al rimborso. Le azioni verso banche, circuiti di pagamento e intermediari vanno avviate separatamente.' },\n    { q: 'Potete garantire il recupero dei soldi?', a: 'No, e nessuno può farlo seriamente. Diffida di chi promette risultati certi o chiede anticipi per \"sbloccare\" i fondi: è una delle truffe più comuni.' },\n  ];\n  componentDidMount() {\n    this.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.setAttribute('data-reveal', 'in'); this.io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });\n    this.observe();\n  }\n  componentDidUpdate() { this.observe(); }\n  componentWillUnmount() { this.io && this.io.disconnect(); }\n  observe() { document.querySelectorAll('[data-reveal=\"\"]').forEach(el => this.io.observe(el)); }\n  renderVals() {\n    const { sent, open, form } = this.state;\n    return {\n      scams: this.scams.map((s,i)=>({...s, delay: (i%3)*0.1+'s'})), trust: this.trust.map((t,i)=>({...t, delay: i*0.08+'s'})), bankStrip: this.bankStrip, reviews: this.reviews.map((r,i)=>({...r, delay: i*0.1+'s'})),\n      docs: this.docList.map(label => { const on = this.state.docs.includes(label); return { label, border: on ? '#0ea5e9' : '#e2e8f0', bg: on ? '#f0f9ff' : '#fff', color: on ? '#0369a1' : '#475569', toggle: () => this.setState(s => ({ docs: on ? s.docs.filter(d => d !== label) : [...s.docs, label] })) }; }), steps: this.steps.map((s,i)=>({...s, delay: i*0.1+'s'})), form, sent, notSent: !sent,\n      faqs: this.faqs.map((f, i) => ({ ...f, open: open === i, rot: open === i ? 'rotate(45deg)' : 'none', toggle: () => this.setState({ open: open === i ? -1 : i }) })),\n      onField: e => this.setState(s => ({ form: { ...s.form, [e.target.name]: e.target.value } })),\n      submit: e => { e.preventDefault(); this.setState({ sent: true }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
